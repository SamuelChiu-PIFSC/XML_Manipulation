[project]
name = "tester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.140.0",
    "icecream>=2.2.0",
    "pdfkit>=1.0.0",
    "uvicorn>=0.51.0",
    "xmltodict>=1.0.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "taskipy>=1.14.1",
    "mypy"
]

[tool.taskipy.tasks]
install = "uv sync"
lint = "uv run ruff check ."
fix = "uv run ruff check --fix ."
format = "uv run ruff format ."

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes (syntax/undefined variables)
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modernize Python syntax)
    "B",    # flake8-bugbear (common bug risks)
    "SIM",  # flake8-simplify (simplifies convoluted code)
    "PTH",  # flake8-use-pathlib (use modern Pathlib over os.path)
    "RUF",  # Ruff-specific internal rules
]

